<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diet App — Infobytes Technosys Proposal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f9fc;--paper:#fff;--ink:#182235;--muted:#68758a;--line:#e4e9f1;
  --orange:#ff6938;--coral:#ff9278;--blue:#4676f5;--cyan:#1ab8c6;
  --purple:#8a5cf4;--mint:#18a78f;--yellow:#f4bd42;--red:#e45c67;
  --navy:#26335d;--shadow:0 22px 60px rgba(31,49,82,.09);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Arial,sans-serif}
body.no-scroll{overflow:hidden}
a{text-decoration:none;color:inherit}
h1,h2,h3,h4{font-family:Outfit,sans-serif;margin:0}
p{margin:0}
.deck{width:100%}
.slide{min-height:100vh;position:relative;padding:92px 6.2vw 100px;overflow:hidden;display:flex;align-items:center}
.slide-inner{width:min(1240px,100%);margin:auto}
.header{position:absolute;top:0;left:0;right:0;height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 4.5vw;z-index:20}
.logo{width:185px;height:42px;display:flex;align-items:center;overflow:hidden}
.logo img{width:185px;height:auto}
.counter{font:700 10px Inter,sans-serif;letter-spacing:.16em;color:#7c8799}
.eyebrow{font:800 10px Inter,sans-serif;letter-spacing:.19em;text-transform:uppercase;color:var(--orange);margin-bottom:16px}
h1{font-size:clamp(64px,9vw,122px);line-height:.86;letter-spacing:-.075em;font-weight:800}
h2{font-size:clamp(42px,5.4vw,76px);line-height:.92;letter-spacing:-.06em;font-weight:800}
h3{font-size:20px;line-height:1.08}
.lead{font-size:18px;line-height:1.58;color:var(--muted);max-width:760px}
.small{font-size:11px;line-height:1.55;color:var(--muted)}
.nav{
 position:absolute;z-index:30;bottom:22px;left:50%;transform:translateX(-50%);
 display:flex;align-items:center;gap:8px;padding:7px;background:rgba(255,255,255,.95);
 border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(31,49,82,.14);
 backdrop-filter:blur(16px)
}
.navbtn{height:42px;padding:0 17px;border:1px solid var(--line);border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;font:800 12px Inter,sans-serif;cursor:pointer}
.navbtn.primary{background:var(--orange);border-color:var(--orange);color:#fff;box-shadow:0 8px 22px rgba(255,105,56,.23)}
.navbtn.disabled{opacity:.32;pointer-events:none}
.dots{display:flex;gap:5px;max-width:235px;overflow:hidden;padding:0 4px}
.dot{width:6px;height:6px;border-radius:50%;background:#ccd4df;flex:0 0 6px}
.dot.active{width:22px;border-radius:10px;background:var(--orange)}
.cover{background:
 radial-gradient(circle at 84% 18%,#dfe8ff 0 7%,transparent 7.2%),
 radial-gradient(circle at 77% 75%,#dff8f4 0 9%,transparent 9.2%),
 linear-gradient(135deg,#fff 0%,#f7faff 58%,#fff7f3 100%)}
.cover-grid{min-height:calc(100vh - 160px);display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:7vw}
.cover h1 span{color:var(--orange)}
.pill{display:inline-flex;margin-top:25px;padding:9px 13px;border-radius:999px;background:#fff0eb;border:1px solid #ffd3c5;color:#c34d25;font:800 9px Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase}
.mockup{height:470px;position:relative;display:flex;align-items:center;justify-content:center}
.phone{width:330px;height:425px;border-radius:32px;background:#fff;border:8px solid #1f2b47;box-shadow:var(--shadow);padding:14px;position:relative;z-index:2}
.phone-top{display:flex;align-items:center;justify-content:space-between;margin:3px 2px 18px}
.avatar{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--orange),#ffae92)}
.phone-title{font:800 14px Outfit}
.mini{font:8px Inter;color:#8792a5}
.dashboard-card{border-radius:18px;padding:17px;margin-bottom:12px}
.d1{background:#fff0eb}.d2{background:#edf3ff}.d3{background:#e9faf6}
.dashboard-card b{display:block;font:700 17px Outfit;margin-bottom:4px}
.dashboard-card span{font:9px Inter;color:#718097}
.food-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.food{height:105px;border-radius:17px;padding:13px;color:#fff}
.food b{font:700 12px Outfit;display:block;margin-bottom:35px}.food span{font:8px Inter;opacity:.88}
.food.a{background:linear-gradient(135deg,#ff6938,#ff9b7d)}.food.b{background:linear-gradient(135deg,#4676f5,#7c9eff)}
.float{position:absolute;padding:13px 15px;border-radius:15px;background:#fff;border:1px solid var(--line);box-shadow:0 16px 38px rgba(31,49,82,.11);font:800 10px Inter;z-index:3}
.fl1{left:0;top:55px;background:#fff0eb;color:#bd4b26}.fl2{right:0;top:105px;background:#edf3ff;color:#315bc5}.fl3{left:18px;bottom:68px;background:#e9faf6;color:#0d7d6c}.fl4{right:4px;bottom:34px;background:#f1ebff;color:#6844c5}
.problem{background:#f6f8fc}
.problem-grid{min-height:calc(100vh - 160px);display:grid;grid-template-columns:.82fr 1.18fr;gap:6vw;align-items:center}
.network{height:475px;border-radius:32px;background:#eef2f8;border:1px solid #dfe6ef;position:relative}
.network:before{content:"";position:absolute;inset:50px;border:1px dashed #cdd6e3;border-radius:50%}
.center-client{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:130px;height:130px;border-radius:50%;background:#fff;border:2px solid #ffb29d;box-shadow:0 14px 30px rgba(31,49,82,.09);display:flex;align-items:center;justify-content:center;text-align:center;font:800 14px Outfit;color:#bd4b26}
.actor{position:absolute;padding:10px 13px;border-radius:13px;background:#fff;border:1px solid var(--line);font:700 10px Inter;box-shadow:0 10px 22px rgba(31,49,82,.06)}
.a1{left:6%;top:16%;color:#bd4b26}.a2{left:43%;top:7%;color:#315bc5}.a3{right:6%;top:25%;color:#6844c5}.a4{left:9%;bottom:17%;color:#0d7d6c}.a5{left:43%;bottom:8%;color:#936b10}.a6{right:8%;bottom:18%;color:#b84f57}
.network-lines{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;overflow:visible}
.network-lines line{stroke:#c9d2df;stroke-width:.22;vector-effect:non-scaling-stroke}
.center-client{z-index:3}.actor{display:flex;align-items:center;gap:7px;z-index:4}
.ui-icon{width:14px;height:14px;display:inline-block;flex:0 0 auto;vertical-align:middle}
.actor .ui-icon{width:13px;height:13px}
.pain-bubble span{display:flex;justify-content:center;align-items:center;font-size:0;margin-bottom:6px}
.pain-bubble .ui-icon{width:24px;height:24px;color:var(--orange)}
.pain-row .icon .ui-icon{width:21px;height:21px}
.big-icon .ui-icon{width:58px;height:58px}
.problem-statement{margin-top:26px;padding:16px 18px;border-left:3px solid var(--orange);background:#fff;border-radius:0 14px 14px 0;font:700 12px Inter;color:#425066}
.pain{background:#fff}
.pain-layout{display:grid;grid-template-columns:.7fr 1.3fr;gap:5vw;align-items:center}
.pain-visual{height:500px;position:relative}
.pain-visual .big-icon{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:170px;height:170px;border-radius:38px;background:linear-gradient(135deg,#ff6938,#ff9c7d);box-shadow:0 25px 55px rgba(255,105,56,.22);display:flex;align-items:center;justify-content:center;color:#fff;font-size:58px}
.pain-orbit{position:absolute;inset:25px;border:1px dashed #cfd7e2;border-radius:50%}
.pain-bubble{position:absolute;width:125px;min-height:75px;padding:12px;border-radius:17px;background:#fff;border:1px solid var(--line);box-shadow:0 14px 30px rgba(31,49,82,.08);font:800 10px Inter;text-align:center}
.pain-bubble span{display:block;font-size:24px;margin-bottom:6px}
.pb1{left:0;top:60px}.pb2{right:0;top:40px}.pb3{left:5px;bottom:65px}.pb4{right:5px;bottom:45px}.pb5{left:50%;top:0;transform:translateX(-50%)}
.pain-list{display:grid;gap:13px}
.pain-row{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:14px;padding:16px 18px;border:1px solid var(--line);border-radius:18px;background:#fff}
.pain-row .icon{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:20px}
.pain-row:nth-child(1) .icon{background:#fff0eb}.pain-row:nth-child(2) .icon{background:#edf3ff}.pain-row:nth-child(3) .icon{background:#f1ebff}.pain-row:nth-child(4) .icon{background:#e9faf6}.pain-row:nth-child(5) .icon{background:#fff5d9}
.pain-row b{font:800 14px Outfit}.pain-row p{font:10px Inter;color:var(--muted);margin-top:3px}.impact{font:800 8px Inter;letter-spacing:.1em;color:#7d899b}
.opportunity{background:linear-gradient(135deg,#fff,#f4f8ff)}
.opp-grid{min-height:calc(100vh - 160px);display:grid;grid-template-columns:1fr 1.2fr;gap:7vw;align-items:center}
.before-after{display:grid;grid-template-columns:1fr 58px 1fr;align-items:center}
.side{padding:24px;border-radius:25px;background:#fff;border:1px solid var(--line);min-height:330px}
.side h3{font-size:27px;margin-bottom:18px}.side ul{padding:0;margin:0;list-style:none;display:grid;gap:12px}.side li{font:600 11px Inter;color:#617087;display:flex;gap:9px;align-items:center}.side li i{width:8px;height:8px;border-radius:50%;display:block;background:#cfd6e1}.after li i{background:var(--mint)}
.transform{width:48px;height:48px;border-radius:16px;background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:0 12px 28px rgba(255,105,56,.22)}
.thesis{margin-top:20px;padding:18px 20px;background:#fff;border:1px solid var(--line);border-radius:18px;font:700 13px Inter}
.journey-bar{margin-top:22px;padding:17px;border-radius:18px;background:#182235;color:#fff;display:flex;gap:0;overflow:hidden}
.journey-bar span{flex:1;text-align:center;font:800 9px Inter;padding:8px;border-right:1px solid rgba(255,255,255,.13)}.journey-bar span:last-child{border:0}
.flow{background:#f5f8fc}
.flow.proposed{background:linear-gradient(135deg,#f3fffc,#f5f8ff)}
.flow-head{display:flex;align-items:flex-end;justify-content:space-between;gap:30px}
.flow-badge{padding:9px 12px;border-radius:999px;font:900 9px Inter;letter-spacing:.12em;white-space:nowrap}.current{background:#ffecec;color:#c44f58}.connected{background:#e6faf5;color:#137c69}
.mindmap{min-height:475px;margin-top:35px;position:relative}
.mind-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:180px;height:180px;border-radius:50%;background:#fff;border:3px solid #ffb39d;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;text-align:center;font:800 21px Outfit;color:#bd4b26;z-index:3}
.branch{position:absolute;width:43%;top:30px;bottom:30px}
.branch.left{left:0}.branch.right{right:0}
.branch-title{display:flex;align-items:center;gap:10px;font:800 18px Outfit;margin-bottom:15px}.branch-title .avatar2{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px}.diet{background:var(--blue)}.client{background:var(--purple)}
.flow-list{display:grid;gap:8px}
.flow-chip{padding:12px 14px;border-radius:14px;background:#fff;border:1px solid var(--line);font:700 10px Inter;position:relative;box-shadow:0 8px 22px rgba(31,49,82,.04)}
.flow-list .flow-chip:after{content:"↓";position:absolute;left:50%;bottom:-13px;color:#a9b3c2;font-weight:900}.flow-list .flow-chip:last-child:after{display:none}
.branch.left .flow-chip{border-left:3px solid var(--blue)}.branch.right .flow-chip{border-left:3px solid var(--purple)}
.proposed-map{min-height:475px;margin-top:35px;display:grid;grid-template-columns:1fr 260px 1fr;align-items:center;gap:22px}
.pro-col{display:grid;gap:9px}.pro-chip{padding:14px;border-radius:15px;background:#fff;border:1px solid var(--line);font:700 10px Inter;box-shadow:0 8px 22px rgba(31,49,82,.04)}.pro-chip b{display:block;font:800 13px Outfit;margin-bottom:3px}.pro-chip span{color:var(--muted);font-size:9px}
.platform{height:320px;border-radius:42px;background:linear-gradient(145deg,#182235,#334678);color:#fff;box-shadow:0 28px 65px rgba(28,42,72,.2);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:25px}
.platform h3{font-size:35px}.platform p{font:10px Inter;color:#cdd6e6;margin-top:8px}.platform .mini-tags{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin-top:22px}.mini-tags span{font:800 8px Inter;padding:7px 8px;border-radius:999px;background:rgba(255,255,255,.1)}
.ai{background:linear-gradient(135deg,#f8f5ff,#f4fbff)}
.ai-grid{min-height:calc(100vh - 160px);display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:7vw}
.ai-list{display:grid;gap:10px;margin-top:30px}.ai-item{display:flex;gap:13px;align-items:center;padding:15px 17px;border:1px solid var(--line);border-radius:16px;background:#fff}.ai-icon{width:36px;height:36px;border-radius:11px;color:#fff;display:flex;align-items:center;justify-content:center;font:800 10px Inter}.ai-item:nth-child(1) .ai-icon{background:var(--orange)}.ai-item:nth-child(2) .ai-icon{background:var(--blue)}.ai-item:nth-child(3) .ai-icon{background:var(--purple)}.ai-item:nth-child(4) .ai-icon{background:var(--cyan)}.ai-item:nth-child(5) .ai-icon{background:var(--yellow);color:#6d510c}.ai-item b{font:800 13px Outfit}.ai-item span{display:block;color:var(--muted);font-size:9px;margin-top:3px}
.ai-orb{width:370px;height:370px;border-radius:50%;margin:auto;background:radial-gradient(circle,#fff 0 26%,#fff0ea 27% 43%,#e9e3ff 44% 62%,#ddf8f3 63% 77%,transparent 78%);display:flex;align-items:center;justify-content:center;text-align:center}.ai-orb b{font:800 48px Outfit;line-height:.85;letter-spacing:-.05em;color:var(--navy)}
.compare{background:#fff}.table-wrap{margin-top:32px;border:1px solid var(--line);border-radius:22px;overflow:auto;background:#fff;box-shadow:var(--shadow)}table{width:100%;min-width:900px;border-collapse:collapse}th,td{padding:13px 16px;border-bottom:1px solid #edf0f5;text-align:center;font:500 10px Inter}th{background:#f5f7fa;color:#7d899b;font-size:8px;letter-spacing:.12em;text-transform:uppercase}th:first-child,td:first-child{text-align:left}tr:last-child td{border-bottom:0}.mark{display:inline-flex;width:24px;height:24px;border-radius:50%;align-items:center;justify-content:center;font-weight:900}.yes{background:#e6f7ee;color:#218154}.no{background:#ffeded;color:#d2545c}.part{background:#fff5d8;color:#9b7117}
.unique{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:13px}.unique div{padding:13px 7px;border-radius:13px;background:#f7f9fc;border:1px solid var(--line);text-align:center;font:800 8px Inter;color:#536177}
.plans{background:#f7f9fc}.plan-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:17px;margin-top:34px}.plan{background:#fff;border:1px solid var(--line);border-radius:24px;padding:27px;min-height:410px;box-shadow:0 15px 35px rgba(31,49,82,.05)}.plan.pro{border:2px solid var(--orange);transform:translateY(-8px);box-shadow:0 23px 45px rgba(255,105,56,.14)}.plan .label{font:900 9px Inter;letter-spacing:.14em;text-transform:uppercase;color:var(--orange)}.plan h3{font-size:34px;margin:9px 0 4px}.plan p{font-size:10px;color:var(--muted);min-height:42px}.price{font:800 24px Outfit;color:var(--navy);margin:18px 0}.price small{font:700 8px Inter;color:#7c8799}.feature{padding:8px 0;border-bottom:1px solid #edf0f4;font-size:10px}.feature b{color:var(--mint)}
.package{background:#fff}.package-head{display:flex;align-items:flex-end;justify-content:space-between;gap:30px}.package-badge{padding:11px 14px;border-radius:999px;background:#edf3ff;color:#315bc5;font:900 9px Inter;letter-spacing:.13em}.package.propkg .package-badge{background:#f1ebff;color:#6844c5}.package.prempkg .package-badge{background:#e9faf6;color:#0d7d6c}
.stage-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:38px}.stage{padding:21px;border:1px solid var(--line);border-radius:19px;background:#fff;min-height:175px;position:relative}.stage:before{content:"";position:absolute;top:0;left:20px;right:20px;height:3px;border-radius:0 0 4px 4px;background:var(--orange)}.stage:nth-child(2):before{background:var(--blue)}.stage:nth-child(3):before{background:var(--purple)}.stage:nth-child(4):before{background:var(--mint)}.stage .n{font:900 8px Inter;letter-spacing:.14em;color:#7d899b}.stage h3{font-size:22px;margin:10px 0 7px}.stage p{font-size:9px;color:var(--muted);line-height:1.5}.feature-chain{margin-top:15px;display:flex;flex-wrap:wrap;gap:5px}.feature-chain span{font:800 8px Inter;padding:6px 7px;border-radius:999px;background:#f1f4f8;color:#536177}
.outcome{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.outcome-card{padding:20px;border-radius:18px;background:#f7f9fc;border:1px solid var(--line)}.outcome-card b{font:800 16px Outfit}.outcome-card p{font-size:10px;color:var(--muted);margin-top:5px}.outcome-line{margin-top:12px;padding:16px;border-radius:16px;background:#182235;color:#fff;font:700 12px Inter}
.roadmap{background:linear-gradient(135deg,#fff,#f5f8fc)}.roadmap-grid{display:grid;grid-template-columns:repeat(4,1fr);margin-top:42px}.phase{padding:24px 18px;background:#fff;border-top:4px solid var(--orange);border-right:1px solid var(--line)}.phase:nth-child(2){border-top-color:var(--purple)}.phase:nth-child(3){border-top-color:var(--cyan)}.phase:nth-child(4){border-top-color:var(--blue)}.phase:last-child{border-right:0}.phase .n{font:900 8px Inter;letter-spacing:.13em;color:#7c8799}.phase h3{font-size:25px;margin:9px 0}.phase p{font-size:10px;color:var(--muted);min-height:45px}.tags{display:flex;flex-wrap:wrap;gap:5px}.tags span{font:700 8px Inter;padding:6px 7px;border-radius:999px;background:#f1f4f8;color:#58667b}
.evolution{background:#182235;color:#fff}.evo{min-height:calc(100vh - 160px);display:flex;align-items:center}.evo-line{display:grid;grid-template-columns:repeat(4,1fr);margin-top:50px}.evo-card{padding:26px;border-left:1px solid rgba(255,255,255,.14)}.evo-card:first-child{border-left:0}.evo-card .n{font:900 8px Inter;letter-spacing:.15em;color:#aeb9ce}.evo-card h3{font-size:27px;margin:10px 0}.evo-card p{font-size:10px;line-height:1.55;color:#bdc8da}.evo-arrow{color:var(--orange);font-size:24px}
.final{background:linear-gradient(135deg,#ff6938,#ef5c68 48%,#7858e9);color:#fff}.final-inner{min-height:calc(100vh - 160px);display:flex;align-items:center;justify-content:center;text-align:center}.final h2{font-size:clamp(52px,7vw,96px);max-width:1000px;margin:0 auto 25px}.final .lead{color:#fff0ec;margin:auto}.final .eyebrow{color:#ffe0d7}

@media(max-width:950px){
 .cover-grid,.problem-grid,.pain-layout,.opp-grid,.ai-grid{grid-template-columns:1fr}
 .mockup{display:none}.pain-visual{display:none}
 .pain-grid{grid-template-columns:1fr 1fr}.plan-grid,.roadmap-grid{grid-template-columns:1fr 1fr}
 .stage-row{grid-template-columns:1fr 1fr}.proposed-map{grid-template-columns:1fr}.platform{order:-1;height:240px}.branch{position:relative;width:100%;top:auto;bottom:auto;left:auto;right:auto;margin-bottom:20px}.mindmap{display:block;height:auto}.mind-center{position:relative;left:auto;top:auto;transform:none;margin:0 auto 25px}
 .evo-line{grid-template-columns:1fr 1fr}
}
@media(max-width:620px){
 .slide{padding:90px 5vw 100px}.pain-grid,.plan-grid,.roadmap-grid,.stage-row,.outcome{grid-template-columns:1fr}.plan.pro{transform:none}.unique{grid-template-columns:1fr 1fr}.before-after{grid-template-columns:1fr}.transform{margin:12px auto}.journey-bar{display:grid;grid-template-columns:1fr 1fr}.journey-bar span{border-bottom:1px solid rgba(255,255,255,.13)}
 .dots{display:none}.navbtn{padding:0 12px}
}

/* Revised proposal: larger explanatory text and a consistent story across slides. */
.caption{font:600 13px/1.5 Inter,sans-serif;color:#58677b;margin-top:17px}
.eyebrow,.counter{font-size:11px}
.problem-statement{font-size:14px;line-height:1.45}
.pain-list{gap:9px}
.pain-row{padding:12px 16px}
.pain-row b{font-size:16px}
.pain-row p{font-size:13px;line-height:1.4}
.impact{font-size:10px}
.scenario{background:linear-gradient(135deg,#fff,#f3f8ff)}
.scenario h2,.workflow h2,.package h2,.plans h2,.roadmap h2,.decision h2{font-size:clamp(39px,4.7vw,67px)}
.scenario-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:35px}
.scenario-card{min-height:260px;padding:27px;border:1px solid var(--line);border-radius:24px;background:#fff;box-shadow:0 14px 35px rgba(31,49,82,.05)}
.scenario-card .n{font:800 12px Inter;color:var(--orange);letter-spacing:.12em}
.card-icon{width:42px;height:42px;border-radius:13px;background:#fff0eb;color:var(--orange);display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.card-icon .ui-icon{width:21px;height:21px}
.plan .plan-icon{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:#fff0eb;color:var(--orange);margin-bottom:18px}
.plan .plan-icon .ui-icon{width:21px;height:21px}
.feature-tile .tile-icon{width:38px;height:38px;border-radius:12px;background:#edf3ff;color:var(--blue);display:flex;align-items:center;justify-content:center;margin-bottom:15px}
.feature-tile .tile-icon .ui-icon{width:20px;height:20px}
.phase .phase-icon{width:34px;height:34px;border-radius:10px;background:#fff0eb;color:var(--orange);display:flex;align-items:center;justify-content:center;margin:13px 0 8px}
.phase .phase-icon .ui-icon{width:18px;height:18px}
.decision-card .card-icon{margin-bottom:14px}
.detail-card h3{display:flex;align-items:center;gap:10px}
.detail-card h3 .ui-icon{width:22px;height:22px;color:var(--orange)}
.scenario-card h3{font-size:27px;margin:17px 0 13px}
.scenario-card p{font:500 16px/1.55 Inter;color:#526176}
.scenario-note{margin-top:22px;padding:17px 21px;border-radius:17px;background:#182235;color:#fff;font:600 15px/1.45 Inter}
.workflow{background:#f7f9fc}
.workflow.with-app{background:linear-gradient(135deg,#f3fffc,#f5f8ff)}
.journey{margin-top:24px;border:1px solid var(--line);border-radius:21px;overflow:hidden;background:#fff;box-shadow:var(--shadow)}
.journey-head,.journey-row{display:grid;grid-template-columns:180px 1fr 1fr;column-gap:20px;align-items:center}
.journey-head{padding:15px 22px;background:#182235;color:#fff;font:800 12px Inter}
.journey-row{padding:12px 22px;min-height:68px;border-bottom:1px solid #e9edf3}
.journey-row:last-child{border-bottom:0}
.journey-row:nth-child(odd){background:#fbfcfe}
.journey-step{display:flex;align-items:center;gap:11px;font:800 14px Outfit}
.journey-step b{width:26px;height:26px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:#fff0eb;color:#c34d25;font:800 12px Inter;flex:0 0 26px}
.with-app .journey-step b{background:#e6faf5;color:#137c69}
.journey-row p{font:500 13px/1.43 Inter;color:#47566b}
.workflow-takeaway{margin-top:17px;padding:15px 18px;border-radius:15px;background:#fff;border:1px solid var(--line);font:700 14px/1.45 Inter;color:#334158}
.with-app .workflow-takeaway{background:#e6faf5;border-color:#b8e8db;color:#137c69}
.plans .plan-grid{margin-top:25px;gap:14px}
.plans .plan{min-height:0;padding:18px 22px}
.plans .plan.pro{transform:none}
.plans .plan h3{font-size:27px;margin:6px 0}
.plans .plan .label{font-size:11px}
.plans .plan p{font:500 13px/1.45 Inter;min-height:0}
.plans .price{font-size:20px;margin:10px 0 0}
.plans .price small{font-size:10px}
.package-scroll{margin-top:19px;overflow-x:auto;border-radius:16px;border:1px solid var(--line);background:#fff}
.package-matrix{width:100%;min-width:790px;border-collapse:collapse}
.package-matrix th,.package-matrix td{padding:10px 13px;font:600 12px/1.35 Inter;border-bottom:1px solid #e9edf3;text-align:center}
.package-matrix th{background:#f2f5fa;color:#536177;font-weight:800;letter-spacing:0;text-transform:none}
.package-matrix th:first-child,.package-matrix td:first-child{text-align:left;width:46%}
.package-matrix tr:last-child td{border-bottom:0}
.package-matrix .included{color:#137c69;font-weight:900;font-size:16px}
.package-matrix .empty{color:#aeb9c9}
.package-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:31px}
.detail-card{padding:25px 27px;border:1px solid var(--line);border-radius:22px;background:#fff;box-shadow:0 12px 30px rgba(31,49,82,.04)}
.detail-card h3{font-size:25px;margin-bottom:16px}
.detail-card ul{margin:0;padding-left:19px;display:grid;gap:12px}
.detail-card li{font:500 14px/1.5 Inter;color:#43536a}
.detail-example{margin-top:19px;padding:19px 22px;border-radius:18px;background:#182235;color:#fff;font:600 14px/1.55 Inter}
.detail-example b{color:#ffb197}
.pro-tiles,.premium-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:31px}
.premium-tiles{grid-template-columns:repeat(4,1fr)}
.feature-tile{padding:23px;border:1px solid var(--line);border-radius:21px;background:#fff;min-height:231px}
.feature-tile .tile-number{display:inline-flex;width:34px;height:34px;border-radius:11px;align-items:center;justify-content:center;background:#f1ebff;color:#6844c5;font:800 12px Inter}
.premium-tiles .tile-number{background:#e6faf5;color:#137c69}
.feature-tile h3{font-size:23px;margin:17px 0 11px}
.feature-tile p{font:500 14px/1.5 Inter;color:#526176}
.package .lead,.plans .lead,.scenario .lead,.workflow .lead,.roadmap .lead,.decision .lead{font-size:17px}
.roadmap .roadmap-grid{margin-top:31px;gap:13px}
.roadmap .phase{border:1px solid var(--line);border-top:5px solid var(--orange);border-radius:18px;padding:22px}
.roadmap .phase:nth-child(2){border-top-color:var(--purple)}
.roadmap .phase:nth-child(3){border-top-color:var(--cyan)}
.roadmap .phase:nth-child(4){border-top-color:var(--blue)}
.roadmap .phase .n{font-size:11px;color:#526176}
.roadmap .phase h3{font-size:24px}
.roadmap .phase p{font:500 13px/1.45 Inter;min-height:74px}
.roadmap .tags span{font-size:11px;padding:7px 9px}
.decision{background:linear-gradient(135deg,#fff6f1,#f3f6ff)}
.decision-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:35px}
.decision-card{padding:28px;border-radius:22px;background:#fff;border:1px solid var(--line);min-height:225px}
.decision-card .n{font:800 12px Inter;color:var(--orange)}
.decision-card h3{font-size:26px;margin:18px 0 11px}
.decision-card p{font:500 15px/1.5 Inter;color:#526176}
.decision-closer{margin-top:27px;padding:19px 22px;border-radius:17px;background:#182235;color:#fff;font:700 16px/1.45 Inter}
.demo{background:linear-gradient(135deg,#f6f9ff,#f4fffb)}
.demo h2{font-size:clamp(39px,4.7vw,67px)}
.demo .lead{font-size:17px}
.demo-shell{margin-top:24px;border:1px solid var(--line);border-radius:23px;background:#fff;box-shadow:var(--shadow);overflow:hidden}
.demo-heading{padding:13px 19px;background:#182235;color:#fff;display:flex;justify-content:space-between;gap:12px;font:700 12px Inter}
.demo-heading span:last-child{color:#ced8e7}
.demo-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px;background:#f0f4fa}
.demo-step{border:1px solid #d8e1ed;background:#fff;color:#536177;border-radius:11px;padding:11px 8px;cursor:pointer;font:800 12px Inter;text-align:center}
.demo-step.active{border-color:var(--orange);background:#fff0ea;color:#ba4c27}
.demo-step:focus-visible,.demo-action:focus-visible{outline:3px solid #4676f5;outline-offset:2px}
.demo-stage{padding:20px;min-height:318px}
.demo-layout{display:grid;grid-template-columns:minmax(200px,.38fr) minmax(0,1fr);gap:17px;min-height:278px}
.demo-side,.demo-main{border:1px solid var(--line);border-radius:17px;padding:19px;background:#fff}
.demo-side{background:#f5f8fc}
.demo-kicker{font:800 11px Inter;letter-spacing:.1em;text-transform:uppercase;color:#c34d25}
.demo-side h3,.demo-main h3{font-size:25px;margin:10px 0}
.demo-copy{font:500 13px/1.5 Inter;color:#506078}
.demo-list{display:grid;gap:8px;margin-top:14px}
.demo-line{padding:10px 12px;border:1px solid #e1e7ef;border-radius:10px;background:#fff;font:600 12px/1.4 Inter;color:#35445b}
.demo-line.selected{border-color:#b8e8db;background:#e9faf6}
.demo-main{display:flex;flex-direction:column;align-items:flex-start}
.demo-main .demo-copy{max-width:690px}
.demo-detail{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;width:100%;margin:13px 0}
.demo-detail div{padding:11px 13px;border:1px solid #e5ebf2;border-radius:11px;background:#fbfcfe;font:600 12px/1.45 Inter;color:#44546a}
.demo-detail b{display:block;font:800 11px Inter;color:#1e3048;margin-bottom:4px}
.demo-alert{padding:11px 13px;border-radius:11px;background:#fff5e4;border:1px solid #f4d9a1;color:#725519;font:700 12px/1.45 Inter;margin:9px 0;width:100%}
.demo-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:13px}
.demo-action{border:1px solid #d6e0ed;border-radius:10px;background:#fff;color:#30425b;padding:10px 13px;font:800 12px Inter;cursor:pointer}
.demo-action.primary{background:var(--orange);border-color:var(--orange);color:#fff}
.demo-options{width:100%;margin-top:10px;padding:11px 13px;border-radius:11px;background:#e9faf6;color:#175f54;font:600 12px/1.5 Inter}
.plans .plan-grid .plan{display:block;color:inherit;transition:border-color .15s,transform .15s}
.plans .plan-grid .plan:hover{border-color:var(--orange);transform:translateY(-3px)}
.plans .plan-grid .plan.pro:hover{transform:translateY(-3px)}
.plan-open{font:800 11px Inter;color:#c34d25;display:block;margin-top:9px}
.roadmap-opportunity{margin-top:16px;padding:15px 18px;border:1px solid #cbe6f1;border-radius:14px;background:#effaff;color:#315169;font:600 13px/1.5 Inter}
.roadmap-opportunity b{color:#153e61}
@media(max-width:1000px){
 .journey-head,.journey-row{grid-template-columns:135px 1fr 1fr;column-gap:12px}
 .premium-tiles{grid-template-columns:1fr 1fr}
 .scenario-grid,.decision-grid{gap:12px}
}
@media(max-width:700px){
 .slide{overflow:visible;padding-bottom:108px}
 .scenario-grid,.package-detail-grid,.pro-tiles,.premium-tiles,.decision-grid{grid-template-columns:1fr}
 .scenario-card,.feature-tile,.decision-card{min-height:0}
 .journey-head{display:none}
 .journey-row{display:block;padding:15px 18px}
 .journey-step{margin-bottom:8px}
 .journey-row p{margin:5px 0}
 .journey-row p:before{display:block;font-weight:800;color:#253653;margin-bottom:2px}
 .journey-row p:nth-child(2):before{content:'DIETITIAN'}
 .journey-row p:nth-child(3):before{content:'CLIENT'}
 .plans .plan-grid,.roadmap .roadmap-grid{grid-template-columns:1fr}
 .scenario h2,.workflow h2,.package h2,.plans h2,.roadmap h2,.decision h2{font-size:clamp(37px,10vw,55px)}
 .demo h2{font-size:clamp(37px,10vw,55px)}
 .demo-heading{display:block;line-height:1.5}
 .demo-steps{grid-template-columns:repeat(2,1fr)}
 .demo-layout,.demo-detail{grid-template-columns:1fr}
 .demo-stage{min-height:0}
}


/* User-flow slides */
.userflow{background:linear-gradient(135deg,#f8faff 0%,#fff 56%,#fff8f4 100%)}
.userflow .slide-inner{width:min(1320px,100%)}
.userflow h2{font-size:clamp(38px,4.5vw,64px)}
.userflow .lead{font-size:15px;max-width:900px;margin-top:12px}
.flow-diagram{margin-top:25px;padding:22px 22px 18px;border:1px solid #e6ebf3;border-radius:26px;background:rgba(255,255,255,.78);box-shadow:0 18px 48px rgba(31,49,82,.06);position:relative;overflow:hidden}
.flow-top{display:flex;flex-direction:column;align-items:center;position:relative;z-index:2}
.flow-node{display:flex;align-items:center;justify-content:center;gap:8px;min-height:37px;padding:9px 13px;border:1px solid #dce4ef;background:#fff;border-radius:12px;color:#263653;font:700 11px Inter,sans-serif;text-align:center;box-shadow:0 6px 16px rgba(31,49,82,.045);max-width:100%}
.flow-node svg{width:14px;height:14px;flex:0 0 14px;color:var(--blue)}
.flow-node.primary{background:#fff0eb;border-color:#ffd5c7;color:#b74a27}
.flow-node.primary svg{color:var(--orange)}
.flow-node.accent{background:#edf3ff;border-color:#dce6ff;color:#315bc5}
.flow-node.success{background:#e9faf6;border-color:#d0f1e8;color:#087e6d}
.flow-node.start{background:#263653;color:#fff;border-color:#263653;padding:10px 24px}
.flow-node.start svg{color:#fff}
.flow-node.plan{background:#fff0eb;border-color:#ffcbb9;color:#b74a27;padding:10px 22px}
.flow-arrow{height:18px;width:1px;background:#c8d2e1;position:relative}
.flow-arrow:after{content:"";position:absolute;bottom:0;left:-3px;width:6px;height:6px;border-right:1px solid #9eabc0;border-bottom:1px solid #9eabc0;transform:rotate(45deg)}
.flow-auth{display:grid;grid-template-columns:1fr 1fr;gap:48px;position:relative}
.flow-auth:before{content:"";position:absolute;top:-9px;left:25%;right:25%;height:9px;border-top:1px solid #c8d2e1;border-left:1px solid #c8d2e1;border-right:1px solid #c8d2e1;border-radius:8px 8px 0 0}
.flow-auth .flow-node{min-width:82px}
.flow-branches-wrap{position:relative;margin-top:0;padding-top:30px}
.flow-branches-wrap:before{content:"";position:absolute;top:0;left:10%;right:10%;height:1px;background:#c8d2e1}
.flow-branches-wrap:after{content:"";position:absolute;top:-30px;left:50%;height:30px;width:1px;background:#c8d2e1}
.flow-branches{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;position:relative;z-index:1}
.flow-branch{display:flex;flex-direction:column;align-items:stretch;gap:10px;position:relative;min-width:0}
.flow-branch:before{content:"";position:absolute;top:-30px;left:50%;height:30px;width:1px;background:#c8d2e1}
.flow-branch .flow-node{min-height:39px;font-size:10px;padding:8px 7px}
.flow-branch .flow-node.branch-title{min-height:40px;background:#f1f5ff;border-color:#dfe7ff;color:#315bc5;font-size:11px}
.flow-branch .flow-node.branch-title svg{color:#4676f5}
.flow-branch .flow-node.muted{background:#fafbfe;color:#5e6b80}
.flow-branch .flow-node.final{background:#e9faf6;border-color:#d0f1e8;color:#087e6d}
.flow-branch .flow-node:not(:last-child){position:relative}
.flow-branch .flow-node:not(:last-child):after{content:"";position:absolute;left:50%;bottom:-11px;height:11px;width:1px;background:#c8d2e1}
.flow-note{display:flex;align-items:center;gap:9px;margin-top:17px;padding:11px 14px;border-radius:13px;background:#f4f7fc;color:#68758a;font-size:11px;line-height:1.5}
.flow-note svg{width:16px;height:16px;color:var(--mint);flex:0 0 16px}
.with-app .flow-node.branch-title{background:#e9faf6;border-color:#c9eee4;color:#087e6d}
.with-app .flow-node.branch-title svg{color:#0b9a83}
.with-app .flow-node.start{background:#263653}
.with-app .flow-diagram{background:linear-gradient(135deg,#fff 0%,#f8fffd 100%)}
@media(max-width:900px){
 .flow-diagram{padding:18px 14px}
 .flow-branches{gap:7px}
 .flow-branch .flow-node{font-size:9px;padding:7px 4px}
 .flow-node{font-size:10px}
}
@media(max-width:700px){
 .userflow .slide-inner{width:100%}
 .flow-diagram{padding:16px 12px;margin-top:18px;overflow:visible}
 .flow-auth{gap:18px}
 .flow-branches-wrap{padding-top:20px}
 .flow-branches-wrap:before,.flow-branches-wrap:after,.flow-branch:before{display:none}
 .flow-branches{grid-template-columns:1fr;gap:14px}
 .flow-branch{padding:12px;border:1px solid #e6ebf3;border-radius:16px;background:#fff;gap:9px}
 .flow-branch .flow-node{font-size:11px;min-height:36px;padding:8px 10px}
 .flow-branch .flow-node.branch-title{min-height:38px}
 .flow-branch .flow-node:not(:last-child):after{display:none}
 .flow-branch .flow-node:not(.branch-title){margin-left:14px;margin-right:14px}
 .flow-note{font-size:10px}
}


/* Refined comparison: fragmented current journey vs connected product journey */
.userflow .slide-inner{width:min(1380px,100%)}
.userflow h2{max-width:1000px;letter-spacing:-.045em}
.userflow .lead{max-width:1000px;line-height:1.65;color:#68758a}
.userflow .flow-diagram{margin-top:20px;padding:20px 22px 16px}
.current-messy{background:linear-gradient(145deg,#fffaf8 0%,#fff 58%,#fff8f4 100%);border-color:#f0e2dc}
.current-messy .messy-label,.unified-flow .unified-label{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:#8b6c62;margin-bottom:14px}
.messy-label .label-dot{width:7px;height:7px;border-radius:50%;background:#e87555;box-shadow:0 0 0 4px #ffebe4}
.messy-channels{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;position:relative;z-index:2}
.messy-channel{min-height:66px;padding:11px 12px;border:1px solid #eadfd9;border-radius:15px;background:rgba(255,255,255,.94);box-shadow:0 8px 18px rgba(90,57,42,.05);display:flex;align-items:center;gap:10px;font-size:11px;font-weight:750;color:#39465a}
.messy-channel .channel-icon{display:grid;place-items:center;width:31px;height:31px;flex:0 0 31px;border-radius:10px;background:#fff0e9;color:#c65b38}
.messy-channel svg{width:16px;height:16px}
.messy-channel small{display:block;font-size:9px;line-height:1.35;font-weight:500;color:#8a929e;margin-top:3px}
.messy-consolidate{width:min(440px,90%);margin:25px auto 21px;position:relative;z-index:2;display:flex;align-items:center;gap:13px;padding:13px 17px;border-radius:16px;background:#fff;border:1px solid #e9c9bc;box-shadow:0 10px 24px rgba(132,76,55,.09)}
.messy-consolidate .consolidate-icon{width:38px;height:38px;display:grid;place-items:center;flex:0 0 38px;border-radius:12px;background:#fff0e9;color:#c65b38}
.messy-consolidate svg{width:19px;height:19px}
.messy-consolidate strong{display:block;color:#873f2a;font-size:12px}
.messy-consolidate span{display:block;color:#8a7d78;font-size:10px;line-height:1.45;margin-top:3px}
.messy-tangle{position:absolute;z-index:0;left:3%;right:3%;top:77px;width:94%;height:140px;pointer-events:none;opacity:.72}
.messy-tangle path{fill:none;stroke-width:1.25;stroke-dasharray:4 5;stroke-linecap:round}
.messy-tangle circle{fill:#fff;stroke-width:1.5}
.messy-lanes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;position:relative;z-index:2}
.messy-lane{position:relative;min-width:0;padding:13px 12px 12px;border:1px solid #eadfd9;border-radius:16px;background:rgba(255,255,255,.95);box-shadow:0 8px 18px rgba(90,57,42,.035)}
.messy-lane:before{content:"";position:absolute;top:-13px;left:50%;height:13px;border-left:1px dashed #d7b7aa}
.messy-lane-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;color:#9a4d34;font-size:11px;font-weight:800}
.messy-lane-head .lane-icon{width:28px;height:28px;display:grid;place-items:center;border-radius:9px;background:#fff0e9;color:#c65b38;flex:0 0 28px}
.messy-lane-head svg{width:15px;height:15px}
.messy-step{position:relative;padding:9px 9px 9px 11px;margin-top:7px;border-radius:9px;background:#faf7f5;border:1px solid #f0e7e2;color:#667182;font-size:10px;line-height:1.4}
.messy-step:not(:last-child):after{content:"↓";position:absolute;left:50%;bottom:-14px;z-index:2;color:#c6a99d;font-size:11px;font-weight:700}
.messy-step.warn{background:#fff7ed;border-color:#f5dfc1;color:#99612b}
.messy-step.end{background:#fff0e9;border-color:#f2d2c5;color:#a44c30;font-weight:700}
.messy-footer{display:flex;align-items:flex-start;gap:10px;margin-top:14px;padding:11px 13px;border-radius:12px;background:#fff2ed;color:#875b4c;font-size:10px;line-height:1.5}
.messy-footer svg{width:16px;height:16px;flex:0 0 16px;color:#cb6848}
/* Unified app map */
.unified-flow{background:linear-gradient(145deg,#f7fffc 0%,#fff 58%,#f6f9ff 100%);border-color:#dcefe9}
.unified-flow .unified-label{color:#427b70}
.unified-label .label-dot{width:7px;height:7px;border-radius:50%;background:#19a58c;box-shadow:0 0 0 4px #ddf7ef}
.unified-start{display:flex;align-items:center;justify-content:center;gap:10px;position:relative;z-index:2}
.unified-start .flow-node{min-height:39px}
.unified-start .flow-arrow{height:16px}
.unified-onboard{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:0 auto 12px;position:relative;z-index:2}
.unified-onboard .flow-node{min-height:38px}
.unified-hub-wrap{position:relative;padding:18px 0 0;margin-top:2px}

html:`<div class="slide-inner"><div class="eyebrow">04 · Current workflow · illustrative</div><h2>Today, every change needs a handoff.</h2>

  <div class="journey-row"><div class="journey-step"><b>2</b> Assign plan</div><p>Checks previous files and sends a revised plan.</p><p>Receives the plan separately from later guidance.</p></div>
  <div class="journey-row"><div class="journey-step"><b>3</b> Explain meals</div><p>Sends portions, recipes or preparation guidance.</p><p>Looks through messages for the right instructions.</p></div>
  <div class="journey-row"><div class="journey-step"><b>4</b> Handle change</div><p>Responds when a meal or ingredient is unavailable.</p><p>Contacts the dietitian and waits for a replacement.</p></div>
  <div class="journey-row"><div class="journey-step"><b>5</b> Check in</div><p>Finds meal photos, notes and questions to review.</p><p>Sends updates through the available channel.</p></div>

function renderDemo(){
 const stage=document.getElementById("demo-stage");
 if(!stage)return;
 stage.innerHTML=demoScreens[demoStep];
 app.querySelectorAll(".demo-step").forEach((button,i)=>{
  button.classList.toggle("active",i===demoStep);
  if(i===demoStep)button.setAttribute("aria-current","step");
  else button.removeAttribute("aria-current");
 });
}
app.addEventListener("click",event=>{
 const button=event.target.closest("[data-demo-step], [data-demo-action]");
 if(!button)return;
 if(button.dataset.demoStep!==undefined){
  demoStep=Number(button.dataset.demoStep);
  renderDemo();
 }else if(button.dataset.demoAction==="options"){
  const options=document.getElementById("demo-options");
  if(options)options.hidden=false;
 }
});

function header(s){
 return `<header class="header"><a class="logo" href="#cover"><img src="${logo}" alt="Infobytes Technosys"></a><div class="counter">${s.num} / ${String(slides.length).padStart(2,"0")}</div></header>`;
}
function nav(i){
 const prev=i>0?`#${slides[i-1].id}`:"#";
 const next=i<slides.length-1?`#${slides[i+1].id}`:"#";
 return `<div class="nav">
  <a class="navbtn ${i===0?"disabled":""}" href="${prev}">← Prev</a>
  <div class="dots">${slides.map((s,j)=>`<a class="dot ${j===i?"active":""}" href="#${s.id}" title="Slide ${j+1}"></a>`).join("")}</div>
  <a class="navbtn primary ${i===slides.length-1?"disabled":""}" href="${next}">Next →</a>
 </div>`;
}
function fitSlideToViewport(){
 const slide=document.querySelector('.slide[style*="display:flex"]');
 if(!slide)return;
 const inner=slide.querySelector('.slide-inner');
 if(!inner)return;
 inner.style.transform='none';
 const slideStyle=getComputedStyle(slide);
 const padX=(parseFloat(slideStyle.paddingLeft)||0)+(parseFloat(slideStyle.paddingRight)||0);
 const padY=(parseFloat(slideStyle.paddingTop)||0)+(parseFloat(slideStyle.paddingBottom)||0);
 const availableWidth=Math.max(1,slide.clientWidth-padX);
 const availableHeight=Math.max(1,slide.clientHeight-padY);
 const rect=inner.getBoundingClientRect();
 const contentWidth=Math.max(inner.scrollWidth,rect.width);
 const contentHeight=Math.max(inner.scrollHeight,rect.height);
 const scale=Math.min(1,availableWidth/contentWidth,availableHeight/contentHeight);
 inner.style.transform=`scale(${Math.max(.35,scale)})`;
}
function render(){
 const hash=location.hash.replace("#","");
 const found=slides.findIndex(s=>s.id===hash);
 if(found>=0) current=found;
 else current=0;
 app.innerHTML=slides.map((s,i)=>`<section class="slide ${s.cls}" id="${s.id}" style="display:${i===current?"flex":"none"}">${header(s)}${s.html}${nav(i)}</section>`).join("");
 renderDemo();
 document.title=`Diet App — ${slides[current].num}/${String(slides.length).padStart(2,"0")}`;
 window.scrollTo(0,0);
 requestAnimationFrame(fitSlideToViewport);
}
window.addEventListener("hashchange",render);
document.addEventListener("keydown",e=>{
 if(["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName))return;
 if(document.activeElement.closest(".demo-shell"))return;
 if(e.key==="ArrowRight"||e.key==="PageDown"){e.preventDefault();if(current<slides.length-1)location.hash=slides[current+1].id}
 if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();if(current>0)location.hash=slides[current-1].id}
});
render();
window.addEventListener('resize',()=>requestAnimationFrame(fitSlideToViewport));
window.addEventListener('orientationchange',()=>setTimeout(fitSlideToViewport,120));
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>requestAnimationFrame(fitSlideToViewport));
</script>
